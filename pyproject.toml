[project]
name = "support-bot"
version = "0.1.0"
description = "Support Bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Framework
    "fastapi==0.115.5",
    "uvicorn==0.34.0",
    "pydantic==2.12.0",
    "pydantic-settings==2.11.0",
    
    # Database
    "sqlalchemy==2.0.43",
    "psycopg==3.2.3",
    "psycopg-binary==3.2.3",
    
    # Authentication
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    
    # Environment & Config
    "python-dotenv==1.1.1",
    
    # AI/ML Core
    "langchain==0.3.27",
    "langchain-core==0.3.78",
    "langchain-google-genai==2.1.12",
    "langchain-ollama==0.3.10",
    "langchain-community==0.3.31",
    "langchain-text-splitters==0.3.11",
    
    # LangGraph
    "langgraph==0.6.8",
    "langgraph-checkpoint==2.1.2",
    "langgraph-checkpoint-postgres==2.0.10",
    "langgraph-prebuilt==0.6.4",
    "langgraph-sdk==0.2.9",
    
    # Monitoring
    "langsmith==0.4.33",
    
    # Vector Database
    "qdrant-client==1.12.1",
    "sentence-transformers==3.1.1",
    
    # HTTP
    "httpx==0.28.1",
    "requests==2.32.5",
    
    # ML Dependencies (required by sentence-transformers)
    "torch==2.8.0",
    "transformers==4.57.0",
    "huggingface-hub==0.35.3",
    "tokenizers==0.22.1",
    "safetensors==0.6.2",
    
    # Scientific Computing
    "numpy==2.3.3",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
    "joblib==1.5.2",
    "threadpoolctl==3.6.0",
    
    # Utilities
    "tqdm==4.67.1",
    "tenacity==9.1.2",
    "pyyaml==6.0.3",
    "packaging==25.0",
    "typing-extensions==4.15.0",
    
    # Image Processing
    "pillow==11.3.0",
    
    # Async Support
    "anyio==4.11.0",
    "sniffio==1.3.1",
    
    # JSON/Data Processing
    "orjson==3.11.3",
    "jsonpatch==1.33",
    "jsonpointer==3.0.0",
    
    # Template/Text Processing
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    
    # Networking/Protocols
    "certifi==2025.10.5",
    "charset-normalizer==3.4.3",
    "idna==3.10",
    "urllib3==2.5.0",
    
    # Google API
    "google-api-core==2.25.2",
    "google-auth==2.41.1",
    "google-ai-generativelanguage==0.7.0",
    "googleapis-common-protos==1.70.0",
    "grpcio==1.75.1",
    "grpcio-status==1.75.1",
    "proto-plus==1.26.1",
    "protobuf==6.32.1",
    
    # Additional required dependencies
    "aiohttp==3.13.0",
    "aiosignal==1.4.0",
    "multidict==6.7.0",
    "yarl==1.22.0",
    "frozenlist==1.8.0",
    "attrs==25.4.0",
    "async-timeout",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]