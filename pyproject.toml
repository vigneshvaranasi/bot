[project]
name = "support_bot"
version = "0.1.0"
description = "AI-powered support bot using CrewAI and Qdrant vector database"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = { text = "MIT" }
keywords = ["ai", "support", "chatbot", "crewai", "qdrant", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core AI and ML dependencies
    "crewai[tools]>=0.152.0,<1.0.0",
    "google-genai>=1.28.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.36.0",
    "torch>=2.0.0",
    
    # Vector database and data processing
    "qdrant-client>=1.7.0",
    "numpy>=1.24.0",
    
    # Utilities and configuration
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    
    # Optional dependencies for enhanced functionality
    "colorama>=0.4.6",  # For colored terminal output
    "rich>=13.0.0",     # For rich console output
    "click>=8.0.0",     # For CLI improvements

    # API service dependencies
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0"
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    
    # Code quality and formatting
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    
    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    
    # Development utilities
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]

performance = [
    # Performance optimizations
    "uvloop>=0.17.0; sys_platform != 'win32'",
    "orjson>=3.9.0",  # Faster JSON processing
    "httpx>=0.24.0",  # Async HTTP client
]

all = [
    "support_bot[dev,performance]"
]

[project.scripts]
# Main application scripts
support-bot = "support_bot.main:run"
support-bot-train = "support_bot.main:train"
support-bot-replay = "support_bot.main:replay"
support-bot-test = "support_bot.main:test"

# Alias for CrewAI CLI compatibility
run_crew = "support_bot.main:run"

# Utility scripts for database management
populate-qdrant = "support_bot.scripts.populate_qdrant:main"
cleanup-qdrant = "support_bot.scripts.cleanup_qdrant:main"
test-embeddings = "support_bot.scripts.test_embeddings:main"
test-gemini-api = "support_bot.scripts.test_gemini_api:main"

# Development and maintenance scripts
analyze-incidents = "support_bot.scripts.analyze_incidents:main"

# API service script

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

# UV configuration
[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\\.pyi?$'
extend-exclude = '''
/(
  # directories
  \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
skip_gitignore = true

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "crewai.*",
    "qdrant_client.*",
    "sentence_transformers.*",
    "transformers.*",
    "torch.*",
    "google.genai.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
