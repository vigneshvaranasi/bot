[project]
name = "support_bot"
version = "0.1.0"
description = "support-bot using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.152.0,<1.0.0"
]

[project.scripts]
support_bot = "support_bot.main:run"
run_crew = "support_bot.main:run"
train = "support_bot.main:train"
replay = "support_bot.main:replay"
test = "support_bot.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
