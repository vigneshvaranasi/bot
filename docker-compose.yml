services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant-db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  vector_db:
    image: ankane/pgvector
    container_name: vector-db
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: postgres
      POSTGRES_DB: vector_db
    ports:
      - "5433:5432"
    volumes:
      - vector_db_data:/var/lib/postgresql/data

  db:
    image: postgres:18-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: postgres
      POSTGRES_DB: bot_db
    ports:
      - "5434:5432"
    volumes:
      - bot_db_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  bot_db_data:
  vector_db_data:
  qdrant_storage:
